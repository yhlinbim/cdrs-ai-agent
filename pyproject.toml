[project]
name = "cdrs-ai-agent"
version = "0.1.0"
description = "AI layer on top of CDRS: tool-use agent, RAG, and MCP server over the CDRS REST API"
readme = "README.md"
authors = [
    { name = "Yen-Han Lin", email = "yhlinbim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]